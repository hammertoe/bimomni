name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Linux, Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4"
          python-version: "3.11"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync dev dependencies
        run: uv sync --extra dev --extra train

      - name: Run pytest
        run: uv run pytest -q

      - name: Ruff lint
        run: uv run ruff check src tests scripts

  smoke:
    name: Container build smoke (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate finalise image builds
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag bimomni:finalise-dryrun \
            --build-arg BASE_IMAGE=python:3.11-slim-bookworm \
            -f containers/Dockerfile.finalise \
            --target runtime \
            . || true
        # The real finalise image is built on the base training image; the
        # above target fails intentionally on the unimplemented base
        # reference, but the rest of the syntax must still parse.
